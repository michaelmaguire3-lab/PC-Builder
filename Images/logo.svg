<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Your PC Builder Logo</title>
  <desc id="desc">A cheerful cartoon builder wearing a hard hat and high visibility vest, holding a hammer, inside a glowing blue circle.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#173B72"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <linearGradient id="vest" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#EAFE38"/>
      <stop offset="100%" stop-color="#B9D900"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#F0A900"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo background matched to dark navy website container -->
  <circle cx="256" cy="256" r="230" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#18A9FF" stroke-width="10" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#78D7FF" stroke-width="2"/>

  <!-- Subtle tech circuit details -->
  <g opacity="0.45" fill="none" stroke="#1F8FFF" stroke-width="3" stroke-linecap="round">
    <path d="M70 142h60l28-28h46"/>
    <path d="M67 185h94l24-24"/>
    <path d="M351 83v65l29 29h64"/>
    <path d="M378 393h-66l-31 31v39"/>
    <circle cx="204" cy="114" r="5" fill="#1F8FFF"/>
    <circle cx="444" cy="177" r="5" fill="#1F8FFF"/>
    <circle cx="281" cy="463" r="5" fill="#1F8FFF"/>
    <circle cx="70" cy="142" r="5" fill="#1F8FFF"/>
  </g>

  <!-- Hammer behind/above hand -->
  <g transform="rotate(-24 180 208)" stroke="#111827" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="164" y="88" width="28" height="155" rx="9" fill="#8B4A1F"/>
    <rect x="159" y="88" width="10" height="155" rx="5" fill="#B87333" opacity="0.9" stroke="none"/>
    <path d="M122 77h96c19 0 32 9 40 26l-37 12-25-13h-74z" fill="#BBC2CC"/>
    <path d="M218 77c28-2 53 7 68 32l-31 18c-9-14-20-22-37-25z" fill="#8E97A3"/>
    <path d="M99 75c24-12 38-10 51 3l-12 28c-17-11-31-12-51-2z" fill="#D7DCE3"/>
  </g>

  <!-- Builder body -->
  <g stroke="#111827" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- Arms -->
    <path d="M148 271c-32 23-42 64-16 83 29 21 64-12 82-44z" fill="#F0A35D"/>
    <path d="M363 279c33 27 46 68 18 89-29 22-68-14-85-47z" fill="#F0A35D"/>

    <!-- Shirt -->
    <path d="M175 260c27-35 131-36 163 0l34 154c-67 41-167 41-234 0z" fill="#10233D"/>

    <!-- Hi-vis vest -->
    <path d="M194 258c24 18 38 67 44 151h-80l-24-135c15-12 33-18 60-16z" fill="url(#vest)"/>
    <path d="M318 258c-24 18-38 67-44 151h80l24-135c-15-12-33-18-60-16z" fill="url(#vest)"/>
    <path d="M155 337h204" stroke="#D0D7DE" stroke-width="14" opacity="0.85"/>
    <path d="M210 272l30 137" stroke="#D0D7DE" stroke-width="14" opacity="0.85"/>
    <path d="M302 272l-30 137" stroke="#D0D7DE" stroke-width="14" opacity="0.85"/>

    <!-- Neck -->
    <path d="M230 226h52v50c-15 11-36 11-52 0z" fill="#E58F4F"/>

    <!-- Face -->
    <ellipse cx="256" cy="184" rx="72" ry="78" fill="#F4B36E"/>
    <path d="M190 183c-16-2-25 7-21 22 4 17 20 22 31 11z" fill="#F4B36E"/>
    <path d="M322 183c16-2 25 7 21 22-4 17-20 22-31 11z" fill="#F4B36E"/>

    <!-- Hair -->
    <path d="M195 153c20-46 103-54 126 0-44-19-83-19-126 0z" fill="#5B2D16"/>

    <!-- Helmet -->
    <path d="M180 147c17-55 134-55 152 0 6 7 9 14 8 24H172c-1-10 2-17 8-24z" fill="url(#helmet)"/>
    <path d="M210 143c5-41 25-62 46-63 21 1 41 22 46 63" fill="none" stroke="#C48200" stroke-width="6"/>
    <path d="M256 81v90" stroke="#C48200" stroke-width="6"/>
    <path d="M170 171h172" stroke="#111827" stroke-width="9"/>

    <!-- Face details -->
    <ellipse cx="231" cy="182" rx="9" ry="13" fill="#111827" stroke="none"/>
    <ellipse cx="281" cy="182" rx="9" ry="13" fill="#111827" stroke="none"/>
    <circle cx="234" cy="177" r="3" fill="#fff" stroke="none"/>
    <circle cx="284" cy="177" r="3" fill="#fff" stroke="none"/>
    <path d="M215 161c12-9 25-9 35-2" fill="none"/>
    <path d="M262 159c12-7 25-6 35 3" fill="none"/>
    <path d="M258 187c-3 13-8 23-17 30h22" fill="none" stroke="#B86232" stroke-width="5"/>
    <path d="M221 225c20 27 53 27 72 0-22 9-48 9-72 0z" fill="#fff"/>
    <path d="M225 230c23 13 43 12 64 0" fill="none" stroke="#111827" stroke-width="5"/>

    <!-- Hammer hand/glove -->
    <path d="M130 246c9-30 49-32 63-7 9 16 4 39-15 47-23 10-53-13-48-40z" fill="#C47A32"/>
    <path d="M135 249c19 12 34 15 53 2" fill="none" stroke="#8B4A1F" stroke-width="5"/>

    <!-- Other hand/glove -->
    <path d="M350 328c26 4 40 29 24 48-18 22-54 10-57-17-2-18 12-34 33-31z" fill="#C47A32"/>

    <!-- Tool belt -->
    <path d="M143 405c65 29 161 29 226 0v35c-68 39-158 39-226 0z" fill="#8B4A1F"/>
    <rect x="239" y="406" width="42" height="36" rx="8" fill="#C9CED6"/>
    <rect x="250" y="415" width="20" height="17" rx="4" fill="#5B2D16"/>
    <path d="M178 410v50M205 418v53M333 410v50" stroke="#5B2D16"/>
  </g>
</svg>
